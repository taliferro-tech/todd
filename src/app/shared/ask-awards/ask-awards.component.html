<div class="ask-awards" role="dialog" aria-modal="true" aria-labelledby="ask-awards-title">
  <div class="ask-awards__backdrop" *ngIf="!overlayOnly" (click)="close.emit()"></div>
  <section class="ask-awards__panel" *ngIf="!overlayOnly">
    <header class="ask-awards__header">
      <div>
        <span class="ask-awards__eyebrow">General Assistant</span>
        <h2 id="ask-awards-title">Awards</h2>
        <p>Good questions create better movement.</p>
      </div>
      <button type="button" class="ask-awards__close" aria-label="Close Awards" (click)="close.emit()">
        <i class="fa-solid fa-xmark" aria-hidden="true"></i>
      </button>
    </header>

    <div class="ask-awards__progress">
      <div class="ask-awards__progress-track"><div class="ask-awards__progress-fill" [style.width.%]="progress.percent"></div></div>
      <span>{{ progress.unlockedCount }} of {{ progress.totalCount }} unlocked</span>
    </div>

    <div class="ask-awards__grid">
      <article *ngFor="let card of cards; trackBy: trackCard" [class]="card.cardClass">
        <div class="ask-award-card__icon">
          <i *ngIf="!card.mystery; else mysteryIcon" [class]="card.iconClass" aria-hidden="true"></i>
          <ng-template #mysteryIcon>?</ng-template>
        </div>
        <h3>{{ card.title }}</h3>
        <p>{{ card.copy }}</p>
      </article>
    </div>
  </section>

  <div class="ask-award-unlock" *ngIf="pendingAward" role="alertdialog" aria-modal="true" aria-labelledby="ask-award-unlock-title">
    <div class="ask-award-unlock__card">
      <span class="ask-award-unlock__eyebrow">Award Unlocked</span>
      <div class="ask-award-unlock__icon"><i [class]="pendingIconClass" aria-hidden="true"></i></div>
      <h2 id="ask-award-unlock-title">{{ pendingAward.title }}</h2>
      <p>“{{ pendingAward.copy }}”</p>
      <button type="button" (click)="dismiss()">Continue</button>
    </div>
  </div>
</div>
